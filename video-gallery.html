<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vídeo — GHC Vertus Fascinna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* GHC Vertus Fascinna — tema areia-claro/verde-oliva */
      --bg:            #FBF0E5;   /* creme */
      --dark:          #2E3820;   /* verde-oliva */
      --border:        rgba(46,56,32,0.14);
      --border-strong: rgba(46,56,32,0.30);
      --accent:        #2E3820;
      --video-bg:      #1c2213;   /* verde quase preto — palco do vídeo */
      --font-serif:    'Cormorant Garamond', Georgia, serif;
      --font-sans:     'Inter', system-ui, sans-serif;
      --ease:          cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--dark);
      font-family: var(--font-sans);
    }

    #vg-root {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg);
    }

    /* ── HEADER ── */
    #vg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      gap: 12px;
    }
    #vg-brand {
      display: flex;
      flex-direction: column;
      line-height: 1.1;
    }
    #vg-brand .b-name {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    #vg-brand .b-sub {
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.5;
      margin-top: 3px;
    }

    #btn-close {
      width: 38px; height: 38px;
      border: 1px solid var(--border-strong);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      color: var(--dark);
      transition: background 0.25s var(--ease), color 0.25s var(--ease), border-color 0.25s var(--ease);
      flex-shrink: 0;
    }
    #btn-close:hover { background: var(--dark); color: var(--bg); border-color: var(--dark); }

    /* ── STAGE ── */
    #vg-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--video-bg);
      padding: 20px;
    }
    #vg-player {
      width: 100%;
      height: 100%;
      max-width: 1600px;
      object-fit: contain;
      display: block;
      outline: none;
      border-radius: 4px;
    }

    /* Controles nativos: remove o degradê/scrim escuro que surgia atrás da barra
       ao passar o mouse (dava sensação de moldura/corte ao redor do vídeo).
       Mantém apenas os botões/scrubber, sem a sombra em gradiente. */
    #vg-player::-webkit-media-controls-enclosure { background: transparent; }
    #vg-player::-webkit-media-controls-panel {
      background: transparent;
      background-image: none;
      box-shadow: none;
    }

    #vg-foot {
      flex-shrink: 0;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.06em;
      opacity: 0.4;
      padding: 8px 16px 12px;
    }

    @media (max-width: 600px) {
      #vg-header { padding: 10px 14px; }
      #vg-brand .b-name { font-size: 17px; }
      #vg-stage { padding: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.001ms !important;
      }
    }
  </style>
</head>
<body>

<div id="vg-root">
  <header id="vg-header">
    <div id="vg-brand">
      <span class="b-name">Vertus Fascinna</span>
      <span class="b-sub">Teaser de Lançamento</span>
    </div>
    <button id="btn-close" title="Fechar" aria-label="Fechar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="16" height="16">
        <path d="M18 6L6 18M6 6l12 12"/>
      </svg>
    </button>
  </header>

  <div id="vg-stage">
    <video id="vg-player"
           src="assets/video/apresentacao.mp4"
           autoplay playsinline controls
           preload="auto">
    </video>
  </div>

  <p id="vg-foot">Imagens meramente ilustrativas.</p>
</div>

<script>
  var player = document.getElementById('vg-player');

  // tenta autoplay com som; se o browser bloquear, cai para mudo
  player.play().catch(function () {
    player.muted = true;
    player.play().catch(function () {});
  });

  document.getElementById('btn-close').addEventListener('click', closeGallery);

  function closeGallery() {
    try { player.pause(); } catch (e) {}
    if (window.parent !== window) {
      window.parent.postMessage({ action: 'closeGallery' }, '*');
    } else if (window.history.length > 1) {
      history.back();
    } else {
      window.close();
    }
  }
</script>
</body>
</html>
