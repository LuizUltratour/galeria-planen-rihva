<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria — GHC Vertus Fascinna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* GHC Vertus Fascinna — tema areia-claro/verde-oliva.
         --bg = creme (FBF0E5) · --dark = verde-oliva (2E3820) · --accent = verde-oliva */
      --bg: #FBF0E5;            /* creme — fundo principal */
      --surface: #F1E4D7;       /* superfície de card (skeleton) */
      --surface-2: #E7D8C9;     /* superfície elevada / hover */
      --dark: #2E3820;          /* foreground / texto principal (verde-oliva) */
      --text-soft: rgba(46,56,32,0.55);
      --border: rgba(46,56,32,0.14);
      --border-strong: rgba(46,56,32,0.30);
      --accent: #2E3820;        /* verde-oliva — destaque / estado ativo */
      --accent-soft: rgba(46,56,32,0.09);
      --dark-bg: #1c2213;       /* verde quase preto — backdrop do lightbox */
      --white: #FFFFFF;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Inter', system-ui, sans-serif;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--dark);
      font-family: var(--font-sans);
    }

    /* ── ROOT LAYOUT ── */
    #g-root {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg);
    }

    /* ── HEADER ── */
    #g-header {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #btn-close {
      width: 38px;
      height: 38px;
      border: 1px solid var(--border-strong);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.25s var(--ease), color 0.25s var(--ease);
      color: var(--dark);
    }
    #btn-close:hover { background: var(--dark); color: var(--bg); border-color: var(--dark); }

    /* ── FILTER SECTION ── */
    #g-filters {
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    #filter-main {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 14px 36px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #filter-main::-webkit-scrollbar { display: none; }

    .f-btn {
      padding: 7px 20px;
      border: 1px solid var(--border-strong);
      background: transparent;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--dark);
      white-space: nowrap;
      border-radius: 40px;
      transition: background 0.22s var(--ease), color 0.22s var(--ease), border-color 0.22s var(--ease), transform 0.15s var(--ease);
    }
    .f-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
    .f-btn.active { background: var(--accent); color: #FFFFFF; border-color: var(--accent); box-shadow: 0 4px 14px rgba(46,56,32,0.28); }
    .f-btn:active { transform: scale(0.97); }

    /* Sub-filter */
    #filter-sub {
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height 0.38s var(--ease), opacity 0.3s ease;
    }
    #filter-sub.open { max-height: 56px; opacity: 1; }

    #filter-sub-inner {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 8px 36px 13px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #filter-sub-inner::-webkit-scrollbar { display: none; }

    .sf-btn {
      padding: 5px 16px;
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 10.5px;
      font-weight: 400;
      letter-spacing: 0.05em;
      color: var(--dark);
      opacity: 0.55;
      white-space: nowrap;
      border-radius: 40px;
      transition: opacity 0.2s, border-color 0.2s, background 0.2s, color 0.2s;
    }
    .sf-btn:hover { opacity: 1; border-color: var(--border-strong); }
    .sf-btn.active { background: var(--accent); color: var(--white); border-color: var(--accent); opacity: 1; }

    /* ── GALLERY SCROLL ── */
    #g-scroll {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
    }
    #g-scroll::-webkit-scrollbar { width: 5px; }
    #g-scroll::-webkit-scrollbar-track { background: var(--bg); }
    #g-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }

    /* ── GRID ── */
    #g-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 14px;
    }
    @media (max-width: 1100px) { #g-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 700px)  { #g-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 420px)  { #g-grid { grid-template-columns: 1fr; } }

    /* ── SKELETON SHIMMER ── */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position:  400px 0; }
    }
    .g-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(255,255,255,0.03) 0%,
        rgba(255,255,255,0.10) 40%,
        rgba(255,255,255,0.03) 80%
      );
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite linear;
      z-index: 0;
      transition: opacity 0.3s ease;
    }
    .g-card.loaded::before { opacity: 0; pointer-events: none; }

    /* ── CARD BASE ── */
    .g-card {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
      cursor: pointer;
      background: var(--surface);
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 6px 20px rgba(0,0,0,0.28);
      animation: cardIn 0.55s var(--spring) both;
      transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease), border-color 0.4s var(--ease);
    }
    .g-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent);
      box-shadow: 0 16px 38px rgba(0,0,0,0.42), 0 0 0 1px var(--accent-soft);
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(14px) scale(0.98); filter: blur(4px); }
      to   { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
    }

    .g-card img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.65s var(--ease);
      position: relative;
      z-index: 1;
    }
    .g-card.loaded img { opacity: 1; }
    .g-card:hover img { transform: scale(1.06); }

    .card-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 32px 14px 13px;
      background: linear-gradient(to top, rgba(28,34,19,0.92) 0%, rgba(28,34,19,0.52) 58%, transparent 100%);
      color: #FFFFFF;
      opacity: 0;
      transition: opacity 0.35s ease;
      z-index: 2;
    }
    .g-card.loaded .card-overlay { opacity: 1; }

    .card-title {
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.35;
      text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    }
    .card-sub {
      font-size: 9.5px;
      font-weight: 400;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      opacity: 0.75;
      margin-top: 4px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    }

    .card-zoom {
      position: absolute;
      top: 14px; right: 14px;
      width: 34px; height: 34px;
      background: var(--accent);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transform: scale(0.75);
      transition: opacity 0.25s var(--ease), transform 0.3s var(--spring);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(46,56,32,0.40);
      z-index: 2;
    }
    .g-card.loaded:hover .card-zoom { opacity: 1; transform: scale(1); }

    /* Plant card */
    .g-card.is-plant { background: var(--white); }
    .g-card.is-plant img { object-fit: contain; padding: 12px; }
    .g-card.is-plant::before {
      background: linear-gradient(
        90deg,
        rgba(0,0,0,0.04) 0%,
        rgba(0,0,0,0.09) 40%,
        rgba(0,0,0,0.04) 80%
      );
      background-size: 800px 100%;
    }

    /* ── COBERTURA SPECIAL CARD ── */
    .g-card.cob-card {
      grid-column: span 2;
      aspect-ratio: unset;
      cursor: default;
      display: flex;
      flex-direction: column;
      background: var(--white);
      color: #2E3820;                 /* texto marrom sobre card branco de plantas */
      border: 1px solid rgba(0,0,0,0.10);
    }
    .g-card.cob-card:hover { transform: none; box-shadow: 0 6px 20px rgba(0,0,0,0.28); border-color: rgba(0,0,0,0.10); }
    .g-card.cob-card::before { display: none; }
    @media (max-width: 700px) { .g-card.cob-card { grid-column: span 2; } }
    @media (max-width: 420px) { .g-card.cob-card { grid-column: span 1; } }

    /* ── PLANTAS MODE ── */
    #g-grid.plantas-mode {
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 10px;
    }
    #g-grid.plantas-mode .g-card.is-plant,
    #g-grid.plantas-mode .g-card.cob-card {
      height: 420px;
    }
    #g-grid.plantas-mode .g-card.is-plant {
      aspect-ratio: unset;
    }
    #g-grid.plantas-mode .g-card.cob-card {
      grid-column: span 1;
    }
    #g-grid.plantas-mode .cob-body {
      min-height: 0;
    }
    @media (max-width: 700px) {
      #g-grid.plantas-mode { grid-template-columns: 1fr; gap: 8px; padding: 8px; }
      #g-grid.plantas-mode .g-card.cob-card { grid-column: span 1; }
    }

    .cob-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px 14px;
      border-bottom: 1px solid rgba(0,0,0,0.10);
      flex-shrink: 0;
      flex-wrap: wrap;
      gap: 12px;
    }

    .cob-badge {
      display: inline-block;
      padding: 3px 11px;
      background: var(--accent);
      color: #FFFFFF;
      font-size: 8.5px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      border-radius: 40px;
      margin-bottom: 5px;
    }

    .cob-name {
      font-family: var(--font-sans);
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }
    .cob-area {
      font-size: 11px;
      opacity: 0.4;
      margin-top: 2px;
      letter-spacing: 0.04em;
    }
    .cob-sub {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      opacity: 0.45;
      margin-top: 4px;
    }

    /* Floor tab switcher */
    .floor-tabs {
      display: flex;
      padding: 3px;
      border: 1px solid var(--border-strong);
      border-radius: 40px;
      background: var(--bg);
      flex-shrink: 0;
      max-width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .floor-tabs::-webkit-scrollbar { display: none; }
    .floor-tab {
      padding: 5px 16px;
      border: none;
      background: transparent;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: var(--dark);
      opacity: 0.55;
      border-radius: 40px;
      white-space: nowrap;
      transition: background 0.22s var(--ease), color 0.22s var(--ease), opacity 0.22s;
    }
    .floor-tab.active { background: var(--accent); color: #FFFFFF; opacity: 1; }

    /* Floor image area */
    .cob-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      min-height: 280px;
    }
    .floor-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.38s ease;
    }
    .floor-wrap.active { opacity: 1; pointer-events: auto; }

    /* skeleton inside cob body */
    .floor-skeleton {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(0,0,0,0.05) 0%,
        rgba(0,0,0,0.11) 40%,
        rgba(0,0,0,0.05) 80%
      );
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite linear;
      transition: opacity 0.3s ease;
      z-index: 0;
    }
    .cob-body.loaded .floor-skeleton { opacity: 0; pointer-events: none; }

    .floor-wrap img {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
      width: 100%; height: 100%;
      cursor: zoom-in;
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.3s ease;
      position: relative;
      z-index: 1;
    }
    .floor-wrap img.loaded { opacity: 1; }
    .floor-wrap img:hover { transform: scale(1.015); }
    .floor-lbl {
      position: absolute;
      bottom: 14px; left: 14px;
      padding: 4px 12px;
      background: rgba(43,25,4,0.82);
      color: #FFFFFF;
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      border-radius: 40px;
    }

    /* Footer */
    .cob-footer {
      padding: 11px 22px;
      border-top: 1px solid rgba(0,0,0,0.10);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-shrink: 0;
    }
    .btn-see-both {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 18px;
      border: 1px solid rgba(0,0,0,0.22);
      background: transparent;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: #2E3820;
      border-radius: 40px;
      transition: background 0.22s var(--ease), color 0.22s var(--ease), border-color 0.22s var(--ease);
    }
    .btn-see-both:hover { background: var(--accent); color: #FFFFFF; border-color: var(--accent); }
    .cob-hint {
      font-size: 10px;
      letter-spacing: 0.05em;
      color: rgba(46,56,32,0.5);
      text-transform: uppercase;
    }

    /* ── EMPTY STATE ── */
    #g-empty {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 24px;
      gap: 10px;
    }
    #g-empty.show { display: flex; }
    #g-empty p { font-family: var(--font-serif); font-size: 22px; opacity: 0.35; }
    #g-empty small { font-size: 11px; letter-spacing: 0.06em; opacity: 0.25; }

    /* disclaimer */
    #g-disclaimer {
      text-align: center;
      font-family: var(--font-sans);
      font-size: 10px;
      letter-spacing: 0.05em;
      opacity: 0.4;
      padding: 8px 16px 14px;
    }

    /* ── LIGHTBOX ── */
    #lightbox {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: flex;
      flex-direction: column;
      background: rgba(28,34,19,0.985);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #lightbox.open { opacity: 1; pointer-events: auto; }
    #lightbox > * { transform: translateY(8px) scale(0.99); transition: transform 0.35s var(--ease); }
    #lightbox.open > * { transform: translateY(0) scale(1); }

    #lb-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 20px 32px;
      flex-shrink: 0;
    }
    #lb-title {
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: 0.02em;
    }
    #lb-sub {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-top: 4px;
    }
    #lb-counter {
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.06em;
      padding-top: 4px;
    }
    #lb-close {
      width: 38px; height: 38px;
      border: 1px solid rgba(255,255,255,0.25);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      color: #FFFFFF;
      transition: background 0.22s, border-color 0.22s;
      flex-shrink: 0;
    }
    #lb-close:hover { background: var(--accent); color: #FFFFFF; border-color: var(--accent); }

    #lb-body {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 12px 80px;
    }

    #lb-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }

    /* Dual floor lightbox */
    #lb-dual {
      display: none;
      gap: 24px;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
    }
    #lb-dual.show { display: flex; }
    .dual-col {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      height: 100%;
      min-width: 0;
    }
    .dual-lbl {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      flex-shrink: 0;
    }
    .dual-col img {
      flex: 1;
      max-width: 100%;
      min-height: 0;
      object-fit: contain;
    }

    /* Nav arrows */
    .lb-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 46px; height: 46px;
      border: 1px solid rgba(255,255,255,0.18);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      color: #FFFFFF;
      transition: background 0.22s, border-color 0.22s;
    }
    .lb-nav:hover { background: var(--accent); border-color: var(--accent); }
    .lb-nav:disabled { opacity: 0.18; cursor: default; }
    #lb-prev { left: 20px; }
    #lb-next { right: 20px; }

    #lb-foot {
      padding: 12px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 12px;
    }
    #lb-notice {
      font-size: 10.5px;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.06em;
      padding: 6px 18px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 40px;
    }
    #lb-notice:empty { display: none; }

    /* ── ZOOM CONTROLS ── */
    #lb-zoom-bar {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lb-zoom-btn {
      width: 32px; height: 32px;
      border: 1px solid rgba(255,255,255,0.22);
      background: transparent;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      color: #FFFFFF;
      font-size: 18px;
      line-height: 1;
      transition: background 0.2s, border-color 0.2s;
      flex-shrink: 0;
      user-select: none;
    }
    .lb-zoom-btn:hover { background: var(--accent); border-color: var(--accent); }
    .lb-zoom-btn:disabled { opacity: 0.2; cursor: default; }
    #lb-zoom-level {
      font-size: 10.5px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.06em;
      min-width: 36px;
      text-align: center;
    }

    /* image zoom/pan state */
    #lb-img {
      cursor: zoom-in;
      transform-origin: center center;
      will-change: transform;
      transition: opacity 0.18s ease;
    }
    #lb-img.zoomed { cursor: grab; }
    #lb-img.dragging { cursor: grabbing; transition: none; }

    /* ── TRANSIÇÃO DE NAVEGAÇÃO (setas prev/next) ── */
    @keyframes lbOutLeft  { to   { opacity: 0; transform: translateX(-42px); } }
    @keyframes lbOutRight { to   { opacity: 0; transform: translateX(42px);  } }
    @keyframes lbInRight  { from { opacity: 0; transform: translateX(48px);  } to { opacity: 1; transform: translateX(0); } }
    @keyframes lbInLeft   { from { opacity: 0; transform: translateX(-48px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes lbFadeIn   { from { opacity: 0; }                                to { opacity: 1; } }
    #lb-img.o-next { animation: lbOutLeft  0.16s var(--ease) forwards; }
    #lb-img.o-prev { animation: lbOutRight 0.16s var(--ease) forwards; }
    #lb-img.i-next { animation: lbInRight  0.40s var(--spring); }
    #lb-img.i-prev { animation: lbInLeft   0.40s var(--spring); }
    #lb-img.i-fade { animation: lbFadeIn   0.24s var(--ease);  }

    /* ── TOUCH / SWIPE hint on lightbox nav ── */
    @media (hover: none) {
      .card-zoom { opacity: 1; transform: scale(1); }
      .g-card:hover img { transform: none; }
    }

    /* ── TABLET (≤ 900px) ── */
    @media (max-width: 900px) {
      #filter-main { padding: 12px 20px; gap: 5px; }
      #filter-sub-inner { padding: 6px 20px 10px; }
      #lb-head { padding: 16px 20px; }
      #lb-body { padding: 8px 60px; }
      #lb-prev { left: 10px; }
      #lb-next { right: 10px; }
    }

    /* ── MOBILE (≤ 600px) ── */
    @media (max-width: 600px) {
      #g-header { padding: 10px 14px; }

      #filter-main { padding: 10px 12px; gap: 6px; }
      #filter-sub-inner { padding: 6px 12px 10px; }
      .f-btn { padding: 6px 14px; font-size: 10.5px; }
      .sf-btn { padding: 4px 12px; }

      /* grid */
      #g-grid { gap: 2px; padding: 2px; }

      /* card text */
      .card-title { font-size: 11.5px; }

      /* cob-card header stacks vertically */
      .cob-header { flex-direction: column; align-items: flex-start; padding: 14px 16px 10px; gap: 10px; }
      .cob-name { font-size: 16px; }
      .cob-body { min-height: 200px; }
      .cob-footer { padding: 9px 16px; }
      .btn-see-both { font-size: 10px; padding: 6px 14px; }

      /* lightbox */
      #lb-head { padding: 12px 14px; flex-wrap: wrap; gap: 8px; }
      #lb-title { font-size: 14px; }
      #lb-body { padding: 0; }

      /* arrows float over image on mobile */
      #lb-prev, #lb-next {
        width: 38px; height: 38px;
        background: rgba(28,34,19,0.6);
        border-color: transparent;
      }
      #lb-prev { left: 8px; }
      #lb-next { right: 8px; }

      /* dual view stacks vertically on mobile */
      #lb-dual { flex-direction: column; gap: 12px; padding: 12px; }
      .dual-col { height: auto; flex: none; width: 100%; }
      .dual-col img { max-height: 35vh; }

      #lb-foot { padding: 8px 14px; }
      #lb-notice { font-size: 9.5px; padding: 4px 14px; }
    }

    /* ── VERY SMALL (≤ 360px) ── */
    @media (max-width: 360px) {
      .f-btn { padding: 5px 10px; font-size: 10px; }
      .floor-tab { padding: 4px 10px; font-size: 10px; }
    }

    /* ── ACESSIBILIDADE / DESEMPENHO: respeitar redução de movimento ── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
      .g-card { animation: none; filter: none; }
      .g-card:hover { transform: none; }
      .g-card:hover img { transform: none; }
      .g-card::before, .floor-skeleton { animation: none; }
      #lightbox > * { transform: none; }
      #lb-img.o-next, #lb-img.o-prev, #lb-img.i-next, #lb-img.i-prev, #lb-img.i-fade { animation-duration: 0.001ms; }
    }
  </style>
</head>

const st = {
  cat:    'all',
  sub:    null,
  lbItems: [],
  lbIdx:   -1,
  lbDual:  false,
};

const $ = id => document.getElementById(id);

const elFilterMain    = $('filter-main');
const elFilterSub     = $('filter-sub');
const elFilterSubIn   = $('filter-sub-inner');
const elGrid          = $('g-grid');
const elEmpty         = $('g-empty');
const elLightbox      = $('lightbox');
const elLbImg         = $('lb-img');
const elLbDual        = $('lb-dual');
const elLbTitle       = $('lb-title');
const elLbSub         = $('lb-sub');
const elLbCounter     = $('lb-counter');
const elLbNotice      = $('lb-notice');
const elLbPrev        = $('lb-prev');
const elLbNext        = $('lb-next');

// ── modo: 'imagens' | 'plantas' | 'all' ──────────────────────────
const MODE = (() => {
  try {
    const m = new URLSearchParams(window.location.search).get('mode') || 'all';
    return ['all','imagens','plantas'].includes(m) ? m : 'all';
  } catch(_) { return 'all'; }
})();

// Categorias exibidas no filtro principal conforme modo
const DISPLAY_CATS = (() => {
  if (MODE === 'plantas') return [
    { id: 'pl-implantacoes', label: 'Implantações' },
    { id: 'pl-unidades',     label: 'Apartamentos' },
  ];
  if (MODE === 'imagens') return GALLERY_CONFIG.categories.filter(c => c.id !== 'plantas');
  return GALLERY_CONFIG.categories;
})();

// ── helpers ──────────────────────────────────────────────────────
function getCat(id) { return GALLERY_CONFIG.categories.find(c => c.id === id); }
function getSubLabel(catId, subId) {
  const cat = getCat(catId);
  if (!cat || !cat.subs) return '';
  const s = cat.subs.find(s => s.id === subId);
  return s ? s.label : '';
}

// ── filters ──────────────────────────────────────────────────────
function renderMainFilters() {
  elFilterMain.innerHTML = '';
  DISPLAY_CATS.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'f-btn' + (cat.id === st.cat ? ' active' : '');
    b.textContent = cat.label;
    b.addEventListener('click', () => {
      if (cat.id === st.cat) return;
      st.cat = cat.id;
      // Se a categoria tem sub-filtros, pré-seleciona o primeiro
      st.sub = (cat.subs && cat.subs.length) ? cat.subs[0].id : null;
      renderMainFilters(); renderSubFilters(); renderGallery();
    });
    elFilterMain.appendChild(b);
  });
}

function renderSubFilters() {
  // No modo plantas o filtro principal já é a tipologia — sem sub-filtro
  if (MODE === 'plantas') { elFilterSub.classList.remove('open'); return; }
  const cat = getCat(st.cat);
  if (cat && cat.subs && cat.subs.length) {
    elFilterSubIn.innerHTML = '';
    const addSub = (id, label) => {
      const b = document.createElement('button');
      b.className = 'sf-btn' + (st.sub === id ? ' active' : '');
      b.textContent = label;
      b.addEventListener('click', () => {
        if (st.sub === id) return;
        st.sub = id;
        renderSubFilters(); renderGallery();
      });
      elFilterSubIn.appendChild(b);
    };
    cat.subs.forEach(s => addSub(s.id, s.label));
    elFilterSub.classList.add('open');
  } else {
    elFilterSub.classList.remove('open');
  }
}

// ── gallery ──────────────────────────────────────────────────────
function filteredItems() {
  return GALLERY_CONFIG.items.filter(item => {
    // Filtro de modo
    if (MODE === 'plantas' && item.category !== 'plantas') return false;
    if (MODE === 'imagens' && item.category === 'plantas') return false;

    // Filtro de categoria
    if (MODE === 'plantas') {
      if (item.subCategory !== st.cat) return false;
    } else {
      if (st.cat && item.category !== st.cat) return false;
      if (st.sub && item.subCategory !== st.sub) return false;
    }
    return true;
  });
}

function renderGallery() {
  const items = filteredItems();
  const existing = elGrid.querySelectorAll('.g-card');

  const doRender = () => {
    elGrid.innerHTML = '';
    elGrid.classList.toggle('plantas-mode', MODE === 'plantas');
    elEmpty.classList.remove('show');
    st.lbItems = items.filter(i => i.type === 'image');
    if (!items.length) { elEmpty.classList.add('show'); return; }
    items.forEach((item, i) => {
      const card = item.type === 'cobertura-plan'
        ? buildCobCard(item)
        : buildImgCard(item);
      card.style.animationDelay = Math.min(i * 0.04, 0.5) + 's';
      elGrid.appendChild(card);
    });
  };

  if (existing.length) {
    existing.forEach(c => { c.style.animation = 'cardOut 0.18s ease forwards'; });
    setTimeout(doRender, 165);
  } else {
    doRender();
  }
}

// inject cardOut keyframe once
(function () {
  const s = document.createElement('style');
  s.textContent = '@keyframes cardOut{to{opacity:0;transform:scale(0.97)}}';
  document.head.appendChild(s);
}());

function buildImgCard(item) {
  const card = document.createElement('div');
  card.className = 'g-card' + (item.isPlant ? ' is-plant' : '');

  const img = document.createElement('img');
  img.src = item.thumb || item.src;
  img.alt = item.title;
  img.loading = 'lazy';
  img.decoding = 'async';
  img.addEventListener('load',  () => card.classList.add('loaded'));
  img.addEventListener('error', () => card.classList.add('loaded'));
  if (img.complete) card.classList.add('loaded');

  const ov = document.createElement('div');
  ov.className = 'card-overlay';
  ov.innerHTML = `<div class="card-title">${item.title}</div>` +
    (item.subtitle ? `<div class="card-sub">${item.subtitle}</div>` :
     item.subCategory ? `<div class="card-sub">${getSubLabel(item.category, item.subCategory)}</div>` : '');

  const zoom = document.createElement('div');
  zoom.className = 'card-zoom';
  zoom.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="15" height="15"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>`;

  card.appendChild(img);
  card.appendChild(ov);
  card.appendChild(zoom);
  card.addEventListener('click', () => openLb(item));
  return card;
}

function buildCobCard(item) {
  const card = document.createElement('div');
  card.className = 'g-card cob-card';

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'cob-header';

  const tg = document.createElement('div');
  tg.innerHTML = `<div class="cob-badge">Planta</div>
    <div class="cob-name">${item.title}</div>
    ${item.area ? `<div class="cob-area">${item.area}</div>` : ''}
    ${item.subtitle ? `<div class="cob-sub">${item.subtitle}</div>` : ''}`;

  const tabs = document.createElement('div');
  tabs.className = 'floor-tabs';

  hdr.appendChild(tg);
  hdr.appendChild(tabs);

  // Body
  const body = document.createElement('div');
  body.className = 'cob-body';

  // skeleton overlay for cob body
  const skel = document.createElement('div');
  skel.className = 'floor-skeleton';
  body.appendChild(skel);

  let loadedCount = 0;
  item.floors.forEach((floor, fi) => {
    // tab
    const tab = document.createElement('button');
    tab.className = 'floor-tab' + (fi === 0 ? ' active' : '');
    tab.textContent = floor.label;
    tab.addEventListener('click', () => {
      tabs.querySelectorAll('.floor-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      body.querySelectorAll('.floor-wrap').forEach((w, wi) => w.classList.toggle('active', wi === fi));
    });
    tabs.appendChild(tab);

    // image wrap
    const wrap = document.createElement('div');
    wrap.className = 'floor-wrap' + (fi === 0 ? ' active' : '');

    const img = document.createElement('img');
    img.src = floor.thumb || floor.src;
    img.alt = floor.label;
    img.loading = 'lazy';
    img.decoding = 'async';
    img.addEventListener('click', () => openLbFloor(item, fi));
    const onImgLoad = () => {
      img.classList.add('loaded');
      loadedCount++;
      if (loadedCount >= item.floors.length) body.classList.add('loaded');
    };
    img.addEventListener('load', onImgLoad);
    img.addEventListener('error', onImgLoad);
    if (img.complete) onImgLoad();

    const lbl = document.createElement('div');
    lbl.className = 'floor-lbl';
    lbl.textContent = floor.label;

    wrap.appendChild(img);
    wrap.appendChild(lbl);
    body.appendChild(wrap);
  });

  // Footer — botão "ver ambas" (sobreposição) só faz sentido com 2 pisos;
  // com mais pavimentos, as abas já alternam entre todos.
  const foot = document.createElement('div');
  foot.className = 'cob-footer';
  if (item.floors.length === 2) {
    const btn = document.createElement('button');
    btn.className = 'btn-see-both';
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="13" height="13">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>${item.viewBothLabel || 'Ver ambas as variantes'}`;
    btn.addEventListener('click', () => openLbDual(item));
    foot.appendChild(btn);
  } else {
    const hint = document.createElement('span');
    hint.className = 'cob-hint';
    hint.textContent = item.floors.length + ' pavimentos — alterne nas abas · toque para ampliar';
    foot.appendChild(hint);
  }

  card.appendChild(hdr);
  card.appendChild(body);
  card.appendChild(foot);
  return card;
}

// ── lightbox ─────────────────────────────────────────────────────
function showLb() {
  elLightbox.classList.add('open');
  document.addEventListener('keydown', onLbKey);
}

function openLb(item) {
  st.lbIdx = st.lbItems.findIndex(i => i.id === item.id);
  st.lbDual = false;
  elLbDual.classList.remove('show');
  elLbImg.style.display = '';
  elLbPrev.style.display = '';
  elLbNext.style.display = '';
  updateLb();
  showLb();
}

function openLbFloor(item, fi) {
  st.lbDual = false;
  elLbDual.classList.remove('show');
  elLbImg.style.display = '';
  elLbPrev.style.display = 'none';
  elLbNext.style.display = 'none';
  elLbImg.src = item.floors[fi].src;
  elLbTitle.textContent = item.title;
  elLbSub.textContent = item.floors[fi].label;
  elLbCounter.textContent = '';
  elLbNotice.textContent = 'As plantas pertencem à mesma unidade';
  showLb();
}

function openLbDual(item) {
  st.lbDual = true;
  elLbImg.style.display = 'none';
  elLbPrev.style.display = 'none';
  elLbNext.style.display = 'none';
  elLbDual.classList.add('show');

  const dcA = $('dc-a'), dcB = $('dc-b');
  dcA.querySelector('.dual-lbl').textContent = item.floors[0].label;
  dcA.querySelector('img').src = item.floors[0].src;
  dcB.querySelector('.dual-lbl').textContent = item.floors[1].label;
  dcB.querySelector('img').src = item.floors[1].src;

  elLbTitle.textContent = item.title;
  elLbSub.textContent = item.area || '';
  elLbCounter.textContent = item.area || '';
  elLbNotice.textContent = 'Ambas as variantes pertencem à mesma unidade';
  showLb();
}

function closeLb() {
  elLightbox.classList.remove('open');
  document.removeEventListener('keydown', onLbKey);
  if (window._lbResetZoom) window._lbResetZoom();
  setTimeout(() => {
    elLbImg.style.display = '';
    elLbPrev.style.display = '';
    elLbNext.style.display = '';
    elLbDual.classList.remove('show');
  }, 300);
}

function updateLb(dir) {
  const item = st.lbItems[st.lbIdx];
  if (!item) return;

  // Textos/contador atualizam de imediato
  elLbTitle.textContent = item.title;
  elLbSub.textContent = item.subtitle || (item.subCategory ? getSubLabel(item.category, item.subCategory) : '');
  elLbCounter.textContent = (st.lbIdx + 1) + ' / ' + st.lbItems.length;
  elLbNotice.textContent = '';
  elLbPrev.disabled = st.lbIdx === 0;
  elLbNext.disabled = st.lbIdx === st.lbItems.length - 1;

  if (st._lbSwapT) clearTimeout(st._lbSwapT);
  elLbImg.classList.remove('o-next','o-prev','i-next','i-prev','i-fade');

  const swap = () => {
    elLbImg.src = item.src;
    elLbImg.style.opacity = '1';
    elLbImg.classList.remove('o-next','o-prev');
    void elLbImg.offsetWidth; // reinicia a animação
    elLbImg.classList.add(dir === -1 ? 'i-prev' : dir === 1 ? 'i-next' : 'i-fade');
  };

  if (dir === 1 || dir === -1) {
    // fase 1: imagem atual desliza para fora no sentido da navegação
    void elLbImg.offsetWidth;
    elLbImg.classList.add(dir === 1 ? 'o-next' : 'o-prev');
    st._lbSwapT = setTimeout(swap, 150);   // fase 2: nova entra pelo lado oposto
  } else {
    elLbImg.style.opacity = '0';
    st._lbSwapT = setTimeout(swap, 110);
  }
}

function navLb(dir) {
  if (st.lbDual) return;
  const ni = st.lbIdx + dir;
  if (ni < 0 || ni >= st.lbItems.length) return;
  st.lbIdx = ni;
  if (window._lbResetZoom) window._lbResetZoom();
  updateLb(dir);
}

function onLbKey(e) {
  if (e.key === 'Escape')      closeLb();
  if (e.key === 'ArrowLeft')   navLb(-1);
  if (e.key === 'ArrowRight')  navLb(1);
}

// ── 3DVista close communication ───────────────────────────────────
function closeGallery() {
  if (window.parent !== window) {
    window.parent.postMessage({ action: 'closeGallery' }, '*');
  }
}

// ── init ──────────────────────────────────────────────────────────
function init() {
  // Filtro inicial depende do modo
  if (MODE === 'plantas') {
    st.cat = 'pl-implantacoes';  // primeira tipologia de plantas
    st.sub = null;
  } else {
    st.cat = DISPLAY_CATS[0].id;               // 'fachada'
    const c0 = getCat(st.cat);
    st.sub = (c0 && c0.subs && c0.subs.length) ? c0.subs[0].id : null;  // pré-seleciona 1ª sub
  }

  renderMainFilters();
  renderSubFilters();
  renderGallery();

  $('btn-close').addEventListener('click', closeGallery);
  $('lb-close').addEventListener('click', closeLb);
  elLbPrev.addEventListener('click', () => navLb(-1));
  elLbNext.addEventListener('click', () => navLb(1));
  $('lb-body').addEventListener('click', e => { if (e.target === $('lb-body')) closeLb(); });
}

// ── zoom + pan in lightbox ───────────────────────────────────────
(function () {
  const img      = document.getElementById('lb-img');
  const body     = document.getElementById('lb-body');
  const btnIn    = document.getElementById('lb-zoom-in');
  const btnOut   = document.getElementById('lb-zoom-out');
  const lblLevel = document.getElementById('lb-zoom-level');

  const MIN = 1, MAX = 5;
  let z = 1, px = 0, py = 0;
  let dragging = false, dragX = 0, dragY = 0, basePx = 0, basePy = 0;
  let pinchDist = null, touchX = 0, touchY = 0, touchPrevX = 0, touchPrevY = 0;

  // transform: translate(px, py) scale(z) com transform-origin: center
  // fórmula correta: px += (cursorX - imgCenterX) * (1 - nz/z)
  function applyTransform(smooth) {
    img.style.transition = smooth ? 'transform 0.18s ease-out' : 'none';
    img.style.transform  = (z === 1 && px === 0 && py === 0)
      ? '' : `translate(${px}px,${py}px) scale(${z})`;
    img.classList.toggle('zoomed', z > 1);
    lblLevel.textContent = Math.round(z * 100) + '%';
    btnOut.disabled = z <= MIN;
    btnIn.disabled  = z >= MAX;
  }

  function resetZoom() {
    z = 1; px = 0; py = 0;
    img.classList.remove('zoomed', 'dragging');
    applyTransform(true);
  }

  function zoomAt(dz, clientX, clientY, smooth) {
    const nz = Math.min(Math.max(z + dz, MIN), MAX);
    if (nz === z) return;
    const r = img.getBoundingClientRect();
    const cx = r.left + r.width  / 2;  // centro atual da imagem na tela
    const cy = r.top  + r.height / 2;
    // mantém o ponto sob o cursor fixo após a mudança de escala
    px += (clientX - cx) * (1 - nz / z);
    py += (clientY - cy) * (1 - nz / z);
    z = nz;
    applyTransform(!!smooth);
  }

  function bodyCenter() {
    const r = body.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  // botões +/−: zoom em direção ao centro do viewport
  btnIn.addEventListener('click',  () => { const c = bodyCenter(); zoomAt(+0.5, c.x, c.y, true); });
  btnOut.addEventListener('click', () => { const c = bodyCenter(); zoomAt(-0.5, c.x, c.y, true); });

  // duplo clique: +2× no ponto clicado, ou reset
  img.addEventListener('dblclick', e => {
    e.stopPropagation();
    if (z > 1) resetZoom(); else zoomAt(+2, e.clientX, e.clientY, true);
  });

  // roda do mouse: zoom suave no cursor
  let wheelRaf = null;
  body.addEventListener('wheel', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (document.getElementById('lb-dual').classList.contains('show')) return;
    e.preventDefault();
    const dz = e.deltaY < 0 ? 0.25 : -0.25;
    // cancelar transição durante scroll rápido para resposta imediata
    if (wheelRaf) cancelAnimationFrame(wheelRaf);
    wheelRaf = requestAnimationFrame(() => {
      zoomAt(dz, e.clientX, e.clientY, false);
      wheelRaf = null;
    });
  }, { passive: false });

  // arrasto com mouse (pan quando ampliado)
  img.addEventListener('mousedown', e => {
    if (z <= 1) return;
    e.preventDefault();
    dragging = true;
    dragX = e.clientX; dragY = e.clientY;
    basePx = px; basePy = py;
    img.classList.add('dragging');
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    px = basePx + (e.clientX - dragX);
    py = basePy + (e.clientY - dragY);
    applyTransform(false);
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    img.classList.remove('dragging');
  });

  // touch: swipe (z=1) ou pan (z>1) ou pinch zoom
  body.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      pinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    } else {
      pinchDist = null;
      touchX = touchPrevX = e.touches[0].clientX;
      touchY = touchPrevY = e.touches[0].clientY;
    }
  }, { passive: true });

  body.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && pinchDist !== null) {
      e.preventDefault();
      const d  = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      zoomAt((d - pinchDist) * 0.018, cx, cy, false);
      pinchDist = d;
    } else if (e.touches.length === 1 && z > 1) {
      e.preventDefault();
      px += e.touches[0].clientX - touchPrevX;
      py += e.touches[0].clientY - touchPrevY;
      touchPrevX = e.touches[0].clientX;
      touchPrevY = e.touches[0].clientY;
      applyTransform(false);
    }
  }, { passive: false });

  body.addEventListener('touchend', e => {
    if (pinchDist !== null) { pinchDist = null; return; }
    if (z > 1) return;
    const dx = e.changedTouches[0].clientX - touchX;
    const dy = e.changedTouches[0].clientY - touchY;
    if (Math.abs(dx) > 40 && Math.abs(dy) < 40) navLb(dx < 0 ? 1 : -1);
  }, { passive: true });

  window._lbResetZoom = resetZoom;
  applyTransform(false);
}());

document.addEventListener('DOMContentLoaded', init);
</script>
